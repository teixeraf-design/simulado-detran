<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado DETRAN com Cronômetro</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --error: #b91c1c;
      --error-bg: #fef2f2;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 680px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: var(--primary);
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #334155;
      transition: all 0.3s ease;
    }

    .timer-box.warning {
      background-color: #fef3c7;
      border-color: var(--warning);
      color: var(--warning);
      animation: pulse 1s infinite alternate;
    }

    .timer-box.danger {
      background-color: var(--error-bg);
      border-color: var(--error);
      color: var(--error);
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.6; }
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .tag-category {
      display: inline-block;
      background-color: #e0e7ff;
      color: #3730a3;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: var(--success);
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: var(--error);
      font-weight: 600;
    }

    .feedback-box {
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.correct {
      display: block;
      background-color: var(--success-bg);
      border: 1px solid var(--success);
      color: #166534;
    }

    .feedback-box.incorrect {
      display: block;
      background-color: var(--error-bg);
      border: 1px solid var(--error);
      color: #991b1b;
    }

    .btn-next {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
      display: none;
    }

    .btn-next:hover {
      background-color: var(--primary-hover);
    }

    /* Tela de Resultado Final */
    .result-screen {
      text-align: center;
      display: none;
    }

    .result-screen h2 {
      font-size: 1.75rem;
      margin-bottom: 12px;
    }

    .score-badge {
      font-size: 3rem;
      font-weight: 800;
      margin: 16px 0;
    }

    .status-pass {
      color: var(--success);
    }

    .status-fail {
      color: var(--error);
    }

    .result-details {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .btn-restart {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-restart:hover {
      background-color: var(--primary-hover);
    }
    
    /* Estilo para a exibição da placa dentro da questão */
    .placa-preview {
      width: 90px;
      height: 90px;
      display: block;
      margin: 0 auto 16px auto;
     }
  </style>
</head>
<body>

<div class="container">
  <!-- TELA DE QUIZ -->
  <div id="quiz-screen">
    <div class="header">
      <div class="header-top">
        <h1>Simulado DETRAN</h1>
        <div id="timer-box" class="timer-box">
          ⏱️ <span id="timer">60:00</span>
        </div>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="meta-info">
        <span id="question-counter">Questão 1 de 30</span>
        <span id="score-counter">Acertos: 0</span>
      </div>
    </div>

    <span id="tag-category" class="tag-category">Legislação</span>
    <div id="question-title" class="question-title">Carregando pergunta...</div>

    <div id="options-container" class="options"></div>

    <div id="feedback-box" class="feedback-box"></div>

    <button id="btn-next" class="btn-next" onclick="nextQuestion()">Próxima Questão</button>
  </div>

  <!-- TELA DE RESULTADO -->
  <div id="result-screen" class="result-screen">
    <h2 id="result-title">Resultado do Simulado</h2>
    <div id="score-badge" class="score-badge">0 / 30</div>
    <div id="result-status" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;"></div>
    <p id="result-details" class="result-details"></p>
    <button class="btn-restart" onclick="startQuiz()">Tentar Novamente</button>
  </div>
</div>

<!-- SPRITE SVG OCULTO PARA USO FUTURO DAS PLACAS -->
<div id="svg-sprite-container" style="display: none;"></div>

<script>
  // Carrega dinamicamente o arquivo dist/placas.svg sem alterar a interface
  async function injectSvgSprite() {
    try {
      const response = await fetch('dist/placas.svg');
      if (response.ok) {
        const spriteText = await response.text();
        document.getElementById('svg-sprite-container').innerHTML = spriteText;
      }
    } catch (err) {
      console.warn("Aviso: Sprite SVG não pôde ser injetado via fetch local sem HTTP server.", err);
    }
  }
  injectSvgSprite();

  // 1. REGRA DE PROPORÇÃO E FUNÇÃO GERADORA
  const QUOTAS = {
    "Legislação de Trânsito": 12,
    "Direção Defensiva": 10,
    "Primeiros Socorros": 4,
    "Meio Ambiente e Cidadania": 2,
    "Mecânica Básica": 2
  };

  function generateProportionalExam(database) {
    let examQuestions = [];

    for (const [category, count] of Object.entries(QUOTAS)) {
      const categoryQuestions = database.filter(q => q.category === category);
      const shuffledCategory = shuffle(categoryQuestions);
      const selected = shuffledCategory.slice(0, count);
      examQuestions = examQuestions.concat(selected);
    }

    return shuffle(examQuestions);
  }

  // 2. BANCO DE DADOS DE QUESTÕES
  const rawQuestions = [
     {
      category: "Legislação de Trânsito",
      question: "A placa de sinalização representada abaixo significa:",
      placaId: "R-1",
      options: [
        { text: "Parada obrigatória à frente.", correct: false },
        { text: "Parada obrigatória.", correct: true },
        { text: "Parada proibida.", correct: false },
        { text: "Ponto de parada de ônibus.", correct: false }
      ],
      explanation: "A placa R-1 indica Parada Obrigatória no local. É a única placa de regulamentação no formato octogonal."
    },    
    {
      category: "Legislação de Trânsito",
      question: "Qual das opções abaixo corresponde a uma infração gravíssima punida com multa e suspensão do direito de dirigir?",
      options: [
        { text: "Transitar em velocidade superior à máxima em até 20%.", correct: false },
        { text: "Dirigir veículo sem usar o cinto de segurança.", correct: false },
        { text: "Dirigir sob a influência de álcool ou de qualquer outra substância psicoativa.", correct: true },
        { text: "Estacionar o veículo sobre a faixa de pedestres.", correct: false }
      ],
      explanation: "Dirigir sob a influência de álcool é infração gravíssima com multa (fator 10x) e suspensão direta da CNH por 12 meses (Art. 165 do CTB)."
    },
    {
      category: "Legislação de Trânsito",
      question: "Quando o sinal semafórico indicar a luz vermelha, o condutor deve:",
      options: [
        { text: "Parar o veículo obrigatoriamente antes da linha de retenção.", correct: true },
        { text: "Reduzir a velocidade e cruzar com cuidado se não houver pedestres.", correct: false },
        { text: "Buzinar para alertar outros motoristas e prosseguir.", correct: false },
        { text: "Acelerar para desocupar a via rapidamente.", correct: false }
      ],
      explanation: "A luz vermelha do semáforo exige parada obrigatória antes da linha de retenção ou da faixa de pedestres."
    },
    {
      category: "Legislação de Trânsito",
      question: "A placa de sinalização R-1 tem formato octogonal, fundo vermelho e a palavra 'PARADA'. Ela significa:",
      options: [
        { text: "Parada obrigatória à frente.", correct: false },
        { text: "Parada obrigatória.", correct: true },
        { text: "Parada proibida.", correct: false },
        { text: "Ponto de parada de ônibus.", correct: false }
      ],
      explanation: "A placa R-1 indica Parada Obrigatória no local. É a única placa de regulamentação no formato octogonal."
    },
    {
      category: "Legislação de Trânsito",
      question: "Ao se aproximar de um cruzamento não sinalizado, a preferência de passagem é do veículo que:",
      options: [
        { text: "Estiver transitando pela direita do outro condutor.", correct: true },
        { text: "Estiver transitando pela esquerda do outro condutor.", correct: false },
        { text: "Desenvolver maior velocidade.", correct: false },
        { text: "Acionar a buzina primeiro.", correct: false }
      ],
      explanation: "Em cruzamento não sinalizado, a regra do CTB determina preferência para quem vem pela direita do condutor."
    },
    {
      category: "Legislação de Trânsito",
      question: "O documento de porte obrigatório que comprova o licenciamento do veículo e a autorização para circulação é o:",
      options: [
        { text: "CRV (Certificado de Registro do Veículo).", correct: false },
        { text: "CRLV (Certificado de Registro e Licenciamento do Veículo) impresso ou digital.", correct: true },
        { text: "Comprovante de pagamento do IPVA.", correct: false },
        { text: "Contrato de compra e venda.", correct: false }
      ],
      explanation: "O CRLV é o documento de porte obrigatório relativo à circulação do veículo (aceito no formato digital oficial ou impresso)."
    },
    {
      category: "Legislação de Trânsito",
      question: "De acordo com o Código de Trânsito Brasileiro (CTB), as vias urbanas classificam-se em:",
      options: [
        { text: "De trânsito rápido, arteriais, coletoras e locais.", correct: true },
        { text: "Rodovias, estradas, vicinais e alamedas.", correct: false },
        { text: "Expressas, preferenciais, secundárias e rurais.", correct: false },
        { text: "Nacionais, estaduais, municipais e particulares.", correct: false }
      ],
      explanation: "As vias urbanas dividem-se legalmente em 4 categorias: Trânsito Rápido, Arteriais, Coletoras e Locais."
    },
    {
      category: "Legislação de Trânsito",
      question: "A validade da Carteira Nacional de Habilitação (CNH) para condutores com idade inferior a 50 anos é de até:",
      options: [
        { text: "3 anos.", correct: false },
        { text: "5 anos.", correct: false },
        { text: "10 anos.", correct: true },
        { text: "2 anos.", correct: false }
      ],
      explanation: "Pela legislação atual do CTB, a validade do exame de aptidão física e mental para condutores com menos de 50 anos é de até 10 anos."
    },
    {
      category: "Legislação de Trânsito",
      question: "O uso de buzina em vias urbanas é permitido desde que:",
      options: [
        { text: "Seja em toques breves, no período das 22h às 6h.", correct: false },
        { text: "Seja em toques breves, para alertar outro condutor sobre intenção de ultrapassar ou evitar acidentes.", correct: true },
        { text: "Seja para apressar o pedestre que atravessa a via.", correct: false },
        { text: "O sinal luminoso do semáforo fique verde.", correct: false }
      ],
      explanation: "A buzina só deve ser usada em toques breves e em situações de alerta de segurança ou para sinalizar ultrapassagem fora das áreas urbanas."
    },
    {
      category: "Legislação de Trânsito",
      question: "Deixar de prestar socorro à vítima de acidente de trânsito, quando possível fazê-lo sem risco pessoal, é considerado:",
      options: [
        { text: "Apenas uma infração de trânsito média.", correct: false },
        { text: "Infração gravíssima e crime de trânsito.", correct: true },
        { text: "Uma conduta sem penalidade prevista se houver testemunhas.", correct: false },
        { text: "Infração leve com remoção do veículo.", correct: false }
      ],
      explanation: "A omissão de socorro é configurada tanto como infração de trânsito gravíssima (Art. 176) quanto como crime de trânsito (Art. 304)."
    },
    {
      category: "Legislação de Trânsito",
      question: "A ultrapassagem de outro veículo em movimento deve ser feita, via de regra, pela:",
      options: [
        { text: "Direita, acionando a buzina.", correct: false },
        { text: "Esquerda, sinalizando com antecedência e observando a segurança.", correct: true },
        { text: "Calçada ou acostamento, quando o trânsito estiver lento.", correct: false },
        { text: "Esquerda, piscando o farol alto continuamente.", correct: false }
      ],
      explanation: "A regra geral do CTB é ultrapassar sempre pela esquerda, devendo o motorista sinalizar com antecedência."
    },
    {
      category: "Legislação de Trânsito",
      question: "As placas de fundo amarelo com símbolos ou textos pretos pertencem à categoria de placas de:",
      options: [
        { text: "Regulamentação.", correct: false },
        { text: "Advertência.", correct: true },
        { text: "Indicação.", correct: false },
        { text: "Serviços auxiliares.", correct: false }
      ],
      explanation: "As placas amarelas são de Advertência e servem para alertar os condutores sobre condições potencialmente perigosas na via."
    },
    {
      category: "Legislação de Trânsito",
      question: "Transitar com o veículo em acostamentos é uma conduta classificada como infração:",
      options: [
        { text: "Média.", correct: false },
        { text: "Grave.", correct: false },
        { text: "Leve.", correct: false },
        { text: "Gravíssima, com multa multiplicada por 3.", correct: true }
      ],
      explanation: "Transitar pelo acostamento é infração gravíssima com fator multiplicador de 3x sobre a multa."
    },
    {
      category: "Direção Defensiva",
      question: "A distância que o veículo percorre desde o momento em que o condutor avista um perigo até o momento em que pisa no freio é chamada de:",
      options: [
        { text: "Distância de frenagem.", correct: false },
        { text: "Distância de reação.", correct: true },
        { text: "Distância de parada total.", correct: false },
        { text: "Distância de seguimento.", correct: false }
      ],
      explanation: "Distância de reação é a distância percorrida do instante em que se vê o perigo até o acionamento mecânico do freio."
    },
    {
      category: "Direção Defensiva",
      question: "A aquaplanagem é o fenômeno em que o veículo perde o contato dos pneus com o solo devido a uma camada de água na pista. Para corrigi-la, o motorista deve:",
      options: [
        { text: "Frear bruscamente e virar o volante rapidamente.", correct: false },
        { text: "Manter a aceleração e puxar o freio de mão.", correct: false },
        { text: "Segurar o volante com firmeza, tirar o pé do acelerador e não frear bruscamente.", correct: true },
        { text: "Engrenar a marcha ré.", correct: false }
      ],
      explanation: "Pressionar os freios na aquaplanagem trava as rodas e causa derrapagens. Deve-se tirar o pé do acelerador e manter o volante firme."
    },
    {
      category: "Direção Defensiva",
      question: "São consideradas 'condições adversas' de trânsito que influenciam na pilotagem:",
      options: [
        { text: "Luz, tempo, via, trânsito, veículo e condutor.", correct: true },
        { text: "Apenas o excesso de velocidade e o consumo de álcool.", correct: false },
        { text: "Marca do veículo, ano de fabricação e cor da pintura.", correct: false },
        { text: "Presença de radares fixos e guardas municipais.", correct: false }
      ],
      explanation: "As 6 condições adversas clássicas na Direção Defensiva são: Luz, Tempo, Via, Trânsito, Veículo e Condutor."
    },
    {
      category: "Direção Defensiva",
      question: "O que significa o conceito de 'ver e ser visto' na direção defensiva?",
      options: [
        { text: "Usar sempre a buzina para alertar os outros.", correct: false },
        { text: "Usar luzes do veículo corretamente e posicionar-se de forma visível aos demais usuários da via.", correct: true },
        { text: "Olhar apenas para o veículo da frente.", correct: false },
        { text: "Parar o veículo no meio da pista para observar o tráfego.", correct: false }
      ],
      explanation: "'Ver e ser visto' é o princípio de enxergar antecipadamente os riscos e garantir que os outros condutores e pedestres notem sua presença."
    },
    {
      category: "Direção Defensiva",
      question: "Trafegar com pneus carecas (profundidade dos sulcos inferior a 1,6 mm) afeta diretamente a segurança porque:",
      options: [
        { text: "Aumenta o consumo de combustível sem impactar a estabilidade.", correct: false },
        { text: "Reduz a aderência com o solo e aumenta o risco de derrapagens e aquaplanagem.", correct: true },

    {
      category: "Direção Defensiva",
      question: "Qual deve ser a atitude de um condutor ao perceber que está sendo ultrapassado por outro veículo?",

        { text: "Acelerar para impedir a ultrapassagem.", correct: false },
        { text: "Manter a velocidade ou reduzi-la ligeiramente e deslocar-se para a direita da faixa, facilitando a manobra.", correct: true },
        { text: "Deslocar-se para a esquerda para fechar a passagem.", correct: false },
        { text: "Ligar o pisca-alerta imediatamente.", correct: false }
      ],
      explanation: "Quem é ultrapassado deve colaborar mantendo a velocidade ou reduzindo um pouco, além de se deslocar para a direita."
    },
    {
      category: "Direção Defensiva",
      question: "A neblina densa reduz drasticamente a visibilidade. Nessa situação, o condutor deve:",
      options: [
        { text: "Ligar o farol alto para enxergar mais longe.", correct: false },
        { text: "Reduzir a velocidade, acender os faróis baixos ou de neblina e manter distância segura do veículo à frente.", correct: true },
        { text: "Ligar o pisca-alerta com o veículo em movimento e acelerar.", correct: false },
        { text: "Parar sobre a pista de rolamento até que a neblina passe.", correct: false }
      ],
      explanation: "Farol alto na neblina reflete a luz nas gotículas d'água e cega a visão. Deve-se usar farol baixo ou de neblina e reduzir a velocidade."
    },
    {
      category: "Direção Defensiva",
      question: "O cinto de segurança de três pontos deve ser utilizado por:",
      options: [
        { text: "Apenas pelo motorista e passageiro do banco da frente.", correct: false },
        { text: "Todos os ocupantes do veículo, inclusive no banco traseiro.", correct: true },
        { text: "Apenas crianças menores de 10 anos.", correct: false },
        { text: "Somente em rodovias federais.", correct: false }
      ],
      explanation: "O cinto é de uso obrigatório para todos os passageiros e motorista em qualquer tipo de via."
    },
    {
      category: "Direção Defensiva",
      question: "O estado físico e mental do condutor é fundamental para a segurança. O cansaço ao volante gera:",
      options: [
        { text: "Redução no tempo de reação e diminuição da concentração.", correct: true },
        { text: "Aumento da agilidade de reflexos.", correct: false },
        { text: "Melhor percepção do ambiente ao redor.", correct: false },
        { text: "Nenhuma alteração no modo de dirigir.", correct: false }
      ],
      explanation: "Fadiga e cansaço retardam as reações do condutor e prejudicam o foco nas condições de tráfego."
    },

  // 3. VARIÁVEIS DE ESTADO
  let questions = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let answered = false;

  // Variáveis do Timer (60 Minutos = 3600 segundos)
  const TOTAL_TIME_SECONDS = 60 * 60;
  let timeRemaining = TOTAL_TIME_SECONDS;
  let timerInterval = null;

  // 4. FUNÇÕES AUXILIARES
  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    const newArray = JSON.parse(JSON.stringify(array));

    while (currentIndex !== 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
    }
    return newArray;
  }

  // 5. FUNÇÃO PRINCIPAL DE INÍCIO
  function startQuiz() {
    clearInterval(timerInterval);
    timeRemaining = TOTAL_TIME_SECONDS;

    // Gera as questões respeitando as proporções
    questions = generateProportionalExam(rawQuestions);

    // Embaralha as alternativas (A, B, C, D) de cada questão sorteada
    questions.forEach(q => {
      q.options = shuffle(q.options);
    });

    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    
    startTimer();
    showQuestion();
  }

  // Lógica do Cronômetro
  function startTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timeRemaining--;
      updateTimerDisplay();

      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        timeOutEndQuiz();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;
    
    const formattedMinutes = String(minutes).padStart(2, '0');
    const formattedSeconds = String(seconds).padStart(2, '0');
    
    const timerElement = document.getElementById('timer');
    const timerBox = document.getElementById('timer-box');
    
    timerElement.innerText = `${formattedMinutes}:${formattedSeconds}`;

    if (timeRemaining <= 300) {
      timerBox.className = 'timer-box danger';
    } else if (timeRemaining <= 600) {
      timerBox.className = 'timer-box warning';
    } else {
      timerBox.className = 'timer-box';
    }
  }

  function timeOutEndQuiz() {
    alert("O tempo de 60 minutos expirou! Seu simulado será finalizado automaticamente.");
    showResults(true);
  }

  // Renderizar a Questão Atual
  function showQuestion() {
    answered = false;
    const q = questions[currentQuestionIndex];

    document.getElementById('question-counter').innerText = `Questão ${currentQuestionIndex + 1} de ${questions.length}`;
    document.getElementById('score-counter').innerText = `Acertos: ${score}`;
    document.getElementById('progress-fill').style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
    
    document.getElementById('tag-category').innerText = q.category;

    let placaHtml = '';
    if (q.placaId) {
      placaHtml = `
        <svg class="placa-preview">
          <use href="#${q.placaId}"></use>
        </svg>
      `;
    }
    
    document.getElementById('question-title').innerHTML = `
      <span>${currentQuestionIndex + 1}. ${q.question}</span>
      ${placaHtml}
    `;

    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.className = 'feedback-box';
    feedbackBox.innerText = '';
    
    const nextBtn = document.getElementById('btn-next');
    nextBtn.style.display = 'none';

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];

    q.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<strong>${letters[index]})</strong> <span>${opt.text}</span>`;
      btn.onclick = () => selectOption(btn, opt, q);
      optionsContainer.appendChild(btn);
    });
  }

  // Validação da Resposta
  function selectOption(selectedBtn, selectedOption, currentQuestion) {
    if (answered) return;
    answered = true;

    const allButtons = document.querySelectorAll('.option-btn');
    allButtons.forEach(btn => btn.disabled = true);

    const feedbackBox = document.getElementById('feedback-box');

    if (selectedOption.correct) {
      score++;
      selectedBtn.classList.add('correct');
      feedbackBox.classList.add('correct');
      feedbackBox.innerHTML = `<strong>Resposta Correta!</strong><br>${currentQuestion.explanation}`;
    } else {
      selectedBtn.classList.add('incorrect');
      feedbackBox.classList.add('incorrect');
      
      allButtons.forEach((btn, idx) => {
        if (currentQuestion.options[idx].correct) {
          btn.classList.add('correct');
        }
      });

      feedbackBox.innerHTML = `<strong>Resposta Incorreta.</strong><br>${currentQuestion.explanation}`;
    }

    document.getElementById('score-counter').innerText = `Acertos: ${score}`;
    
    const nextBtn = document.getElementById('btn-next');
    if (currentQuestionIndex === questions.length - 1) {
      nextBtn.innerText = "Ver Resultado Final";
    } else {
      nextBtn.innerText = "Próxima Questão";
    }
    nextBtn.style.display = 'block';
  }

  // Avançar Questão
  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
      showQuestion();
    } else {
      showResults(false);
    }
  }

  // Tela de Resultados
  function showResults(isTimeOut) {
    clearInterval(timerInterval);

    document.getElementById('quiz-screen').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';

    const percentage = Math.round((score / questions.length) * 100);
    const passed = score >= 21;

    const timeSpentSeconds = TOTAL_TIME_SECONDS - timeRemaining;
    const spentMinutes = Math.floor(timeSpentSeconds / 60);
    const spentSeconds = timeSpentSeconds % 60;
    const timeSpentFormatted = `${String(spentMinutes).padStart(2, '0')}:${String(spentSeconds).padStart(2, '0')}`;

    document.getElementById('result-title').innerText = isTimeOut ? "Tempo Esgotado!" : "Resultado do Simulado";

    const scoreBadge = document.getElementById('score-badge');
    scoreBadge.innerText = `${score} / ${questions.length}`;
    scoreBadge.className = `score-badge ${passed ? 'status-pass' : 'status-fail'}`;

    const resultStatus = document.getElementById('result-status');
    resultStatus.innerText = passed ? "APROVADO!" : "REPROVADO";
    resultStatus.className = passed ? 'status-pass' : 'status-fail';

    document.getElementById('result-details').innerHTML = `
      Você acertou <strong>${score} de ${questions.length} questões</strong> (${percentage}% de aproveitamento).<br>
      Tempo utilizado: <strong>${timeSpentFormatted}</strong> (de 60:00 min).<br><br>
      ${passed 
        ? 'Parabéns, Thaíse 🚀! Você alcançou o desempenho necessário para passar na prova teórica do DETRAN e vai ser recompensada com uma boa comida 🍔🎁😈.' 
        : 'Thaíse, você precisa de pelo menos 21 acertos (70%) para ser aprovada 🤔. Vai ser castigada severamente 😎. Continue estudando! 💕'}
    `;
  }

  window.onload = startQuiz;
</script>
